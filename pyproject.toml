[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-trades"
version = "0.1.0"
description = "Trading signals from congressional hearings, extracted by a local llama.cpp LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
llm = ["llama-cpp-python>=0.3.30"]

[project.scripts]
congress-trades = "congress_trades.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congress_trades = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
